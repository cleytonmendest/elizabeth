name: Gate

# A autoridade final. O hook local é conveniência e pode ser pulado com
# --no-verify; isto aqui não pode. Nenhuma regra do tema vive só na cabeça de
# alguém (ou de uma IA) — tudo que precisa ser verdade é verificado aqui.

on:
  pull_request:
  push:
    branches: [main]

# Nenhum job daqui escreve no repositório: eles leem, compilam e medem. O
# default do repo pode ser mais largo que isso, e um default largo é permissão
# que ninguém escolheu conceder.
permissions:
  contents: read

# Rajada de pushes numa PR não precisa de N execuções do job de navegador (que
# instala Chromium e sobe uma loja). O `board.yml` já fazia isto; a ausência
# aqui era esquecimento, não decisão.
#
# Em `main`, NÃO cancela: ali cada execução é o registro de que aquele commit
# passou, e cancelar apaga o registro em vez de economizar tempo.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Lint, build e conformidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # A catraca precisa do baseline da branch base e do diff contra ela.
          # Com o clone raso do padrão, `origin/main` não existe no runner.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build do Tailwind está em dia
        run: npm run lint -- --rules=build

      - name: Linters do tema
        run: npm run lint

      - name: Painel de conformidade
        if: always()
        run: npm run status -- --md >> "$GITHUB_STEP_SUMMARY"

      # `lint` já falha em violação nova. Este passo garante a outra metade da
      # catraca: ninguém regravar um baseline para cima a fim de "passar".
      #
      # A lógica NÃO mora mais aqui. Ela vivia neste bloco em shell, e o próprio
      # bloco documentava que uma versão anterior dele comparava o total consigo
      # mesmo e passava sem verificar nada — a mesma forma de defeito da sonda
      # da loja. Shell dentro de YAML não tem teste e não roda na máquina de
      # ninguém. Agora é `scripts/catraca.mjs`, COM teste e com mutante.
      #
      # E ela trava DUAS catracas, não uma: o baseline do lint e o de a11y. O
      # segundo não tinha lado de CI nenhum — `npm run test:e2e:baseline` está
      # documentado, e quem regravasse para cima passava verde.
      #
      # `if: always()` porque um PR que falha no lint E cresce o baseline
      # precisa descobrir as duas coisas de uma vez. É o mesmo motivo pelo qual
      # os testes unitários são um job separado deste.
      - name: A dívida registrada não pode crescer
        if: always()
        env:
          # Via env, não interpolado no shell: nome de branch é texto de quem
          # abriu o PR, e `${{ }}` dentro de `run:` monta o script antes do
          # shell ver aspas.
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: node scripts/catraca.mjs --base-ref "$BASE_REF"

  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Job separado do gate de propósito: lint vermelho e teste vermelho são
      # problemas diferentes, e ver os dois de uma vez é mais rápido que
      # descobrir o segundo depois de corrigir o primeiro.
      - name: Vitest
        run: npm test

      # A suíte verde diz que os testes passaram, não que eles verificam algo.
      # Este passo quebra o tema de propósito, uma quebra por vez, e exige que
      # a suíte fique vermelha. Sem ele, um teste que perdeu o alvo continuaria
      # verde para sempre — que é exatamente o modo de falhar que este
      # repositório já viu na catraca do baseline e no board.
      - name: Os testes conseguem falhar?
        run: npm run test:mutants

  e2e:
    name: Navegador (axe + fluxos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O runner do Actions não traz navegador. (O ambiente remoto do Claude
      # Code traz, e lá se usa CHROMIUM_PATH — ver playwright.config.mjs.)
      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      # ── O único bloco deste arquivo que nunca rodou ────────────────────────
      #
      # `shopify theme dev` precisa de uma loja autenticada. Enquanto os
      # secrets não existirem, este passo não sobe nada e o passo seguinte roda
      # só o gate de acessibilidade — avisando em alto e bom som que a metade
      # de storefront ficou de fora (scripts/e2e.mjs).
      #
      # Repare no que NÃO foi feito aqui: o job inteiro não está atrás de um
      # `if:`. Um job que só roda quando um secret existe é o bug que este
      # repositório corrigiu no board — `actions/add-to-project@v1` ficou
      # quebrado dois dias porque o job dele só rodava em evento `issues`, e as
      # execuções verdes eram todas dos outros gatilhos. Aqui o job roda
      # sempre; o que varia é quanto ele consegue medir, e isso aparece.
      #
      # Para ligar: Settings → Secrets and variables → Actions
      #   SHOPIFY_STORE              minha-loja.myshopify.com
      #   SHOPIFY_CLI_THEME_TOKEN    senha de app do Theme Access
      #                              (shopify.dev/docs/storefronts/themes/tools/theme-access)
      - name: Subir a loja de desenvolvimento
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE }}
          # Deliberadamente com outro nome: o CLI lê SHOPIFY_FLAG_STORE_PASSWORD
          # e uma string VAZIA nele conta como "senha fornecida", o que faria a
          # loja sem proteção falhar. Só vira a variável de verdade se existir.
          STORE_PASSWORD: ${{ secrets.SHOPIFY_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          # A decisão fica no shell, NÃO num `if:` do passo — por dois motivos.
          #
          # O primeiro é que não funciona: o contexto `secrets` não existe em
          # `if:`, e a primeira versão disto derrubou o workflow INTEIRO na
          # validação ("Unrecognized named-value: 'secrets'"), levando junto o
          # gate e os testes unitários, que não têm nada a ver com a loja.
          #
          # O segundo é o motivo pelo qual a correção certa não era mover o
          # `if:` para outro lugar: passo condicional é caminho que só roda em
          # certas circunstâncias, e este repositório já perdeu dois dias com
          # um desses. Aqui o passo roda sempre e o shell diz o que fez.
          if [ -z "${SHOPIFY_CLI_THEME_TOKEN:-}" ] || [ -z "${SHOPIFY_FLAG_STORE:-}" ]; then
            echo "Sem credencial da loja (SHOPIFY_STORE / SHOPIFY_CLI_THEME_TOKEN)."
            echo "O passo seguinte roda só o gate de acessibilidade, e avisa."
            exit 0
          fi

          # Loja protegida por senha de storefront: sem isto o CLI PERGUNTA a
          # senha, e perguntar num runner sem terminal é morrer na hora.
          # Loja sem proteção não precisa do secret e não passa por aqui.
          if [ -n "${STORE_PASSWORD:-}" ]; then
            export SHOPIFY_FLAG_STORE_PASSWORD="$STORE_PASSWORD"
            echo "Loja protegida por senha: usando SHOPIFY_STORE_PASSWORD."
          fi

          # Versão TRAVADA, pelo mesmo motivo que existe package-lock.json e
          # que o Node está fixo em 22. Sem o pin, toda execução puxava a
          # última publicada — e o comentário logo abaixo conta que uma
          # mudança de flag deste CLI já matou este passo. Era a única
          # ferramenta solta no gate, e justamente a que já quebrou.
          #
          # Para subir: rode localmente com a versão nova antes de trocar aqui.
          npm install -g @shopify/cli@4.7.0

          # Os flags saíram de `shopify theme dev --help`, não de memória — a
          # primeira versão passava `--theme-editor-sync=false` e o CLI morria
          # com "Unexpected argument: false", porque ele é um switch booleano
          # (e já vem desligado, então some daqui).
          #
          # `--live-reload off` não é conveniência: o modo padrão INJETA um
          # script de hot reload no HTML da vitrine. Esse script não existe na
          # loja de verdade, e medir acessibilidade num DOM que só existe em
          # desenvolvimento seria medir outra página.
          #
          # `--error-overlay silent` pela mesma razão: falha de upload
          # desenha um overlay na página, e o axe acusaria problemas de um
          # elemento que o tema não tem. A falha continua visível no log.
          shopify theme dev \
            --port 9292 \
            --live-reload off \
            --error-overlay silent \
            > theme-dev.log 2>&1 &
          dev_pid=$!

          # A sonda vive em scripts/loja-no-ar.mjs, COM TESTE, e não mais aqui.
          #
          # A versão que morava neste bloco perguntava só
          # `curl -sf -o /dev/null` e declarava "Loja no ar." — e a tela de
          # senha da Shopify responde 200. No dia em que a loja voltou a
          # exigir senha, o passo passou, exportou THEME_URL, e o Playwright
          # mediu acessibilidade da tela de senha por 80 segundos, entregando
          # o problema como 10 falhas de WCAG. Duas horas para descobrir que a
          # loja estava trancada.
          #
          # O defeito era uma sonda que não conseguia falhar: afirmava "o tema
          # está no ar" tendo verificado "alguma coisa respondeu". Agora ela
          # exige `window.shopUrl`, que só existe em página servida pelo nosso
          # layout, e o teste planta as duas páginas para provar que ela
          # separa uma da outra.
          node scripts/loja-no-ar.mjs \
            --url http://127.0.0.1:9292/ \
            --pid "$dev_pid" \
            --log theme-dev.log

          echo "THEME_URL=http://127.0.0.1:9292" >> "$GITHUB_ENV"

      # A conta de cliente é um secret À PARTE da credencial da loja, e a
      # separação tem consequência: a loja pode estar no ar sem a conta
      # existir. Nesse caso o que se declara pulado é só a metade de conta, com
      # o motivo próprio — em vez de um `skip` genérico que esconde qual das
      # duas faltou. Ver e2e/helpers/loja.mjs.
      #
      #   SHOPIFY_CUSTOMER_EMAIL     e-mail da conta de teste
      #   SHOPIFY_CUSTOMER_PASSWORD  senha dela
      #
      # A conta é usada para CADASTRAR e APAGAR endereços a cada execução;
      # use uma descartável, sem dado real.
      - name: Playwright
        env:
          SHOPIFY_CUSTOMER_EMAIL: ${{ secrets.SHOPIFY_CUSTOMER_EMAIL }}
          SHOPIFY_CUSTOMER_PASSWORD: ${{ secrets.SHOPIFY_CUSTOMER_PASSWORD }}
        run: npm run test:e2e

      # O mesmo princípio do job de testes unitários, um nível acima: aqui o
      # alvo da mutação não é o tema, é o VERIFICADOR de acessibilidade. Um
      # critério configurado errado deixaria toda página passar exibindo
      # "0 violações" com a mesma cara de quando está tudo certo.
      - name: O gate de a11y consegue reprovar?
        run: npm run test:mutants -- --e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
