name: Gate

# A autoridade final. O hook local é conveniência e pode ser pulado com
# --no-verify; isto aqui não pode. Nenhuma regra do tema vive só na cabeça de
# alguém (ou de uma IA) — tudo que precisa ser verdade é verificado aqui.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    name: Lint, build e conformidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # A catraca precisa do baseline da branch base e do diff contra ela.
          # Com o clone raso do padrão, `origin/main` não existe no runner.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build do Tailwind está em dia
        run: npm run lint -- --rules=build

      - name: Linters do tema
        run: npm run lint

      - name: Painel de conformidade
        if: always()
        run: npm run status -- --md >> "$GITHUB_STEP_SUMMARY"

      - name: A dívida do baseline não pode crescer
        run: |
          # `lint` já falha em violação nova. Aqui garantimos a outra metade da
          # catraca: ninguém regravar o baseline para cima a fim de "passar".
          #
          # A métrica é ITENS (fingerprints "regra|arquivo|código"), não
          # ocorrências. O mesmo valor ruim repetido cinco vezes num arquivo é
          # 1 item e 5 ocorrências; travar em itens é o que dá um número
          # estável, que não oscila quando alguém move uma linha de lugar.
          #
          # Há UM caso em que crescer é legítimo: melhorar a cobertura de um
          # linter encontra violações que sempre existiram mas não eram vistas.
          # Isso não é dívida nova — é dívida que estava escondida. O sinal que
          # separa os dois casos é objetivo: alguma regra mudou neste diff?
          # Se não mudou, crescimento só pode vir de código novo, e reprova.
          #
          # Ler o baseline da base NÃO pode falhar em silêncio. A versão
          # anterior caía para `|| echo "$total"` quando o `git show` não
          # achava a ref — o que acontecia SEMPRE, porque o checkout raso não
          # traz `origin/main`. O passo comparava o total consigo mesmo,
          # passava, e não verificava nada. Uma catraca que sempre passa é
          # pior que nenhuma: ela dá a impressão de estar guardando.
          base_ref="${{ github.base_ref || 'main' }}"
          total=$(node -p "require('./scripts/lint/config/baseline.json').total")

          if ! base_json=$(git show "origin/$base_ref:scripts/lint/config/baseline.json" 2>&1); then
            echo "::error::Não consegui ler o baseline de origin/$base_ref — a catraca não pôde ser verificada. Passar assim seria fingir que verificou."
            echo "$base_json"
            exit 1
          fi
          base=$(printf '%s' "$base_json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).total")
          echo "baseline: $base → $total itens"

          if [ "$total" -le "$base" ]; then exit 0; fi

          if git diff --name-only "origin/$base_ref...HEAD" | grep -q '^scripts/lint/rules/'; then
            echo "::warning::O baseline subiu de $base para $total itens, mas uma regra mudou neste PR — crescimento tratado como cobertura nova, não dívida nova. Confirme no corpo do PR que o código do tema não piorou."
            exit 0
          fi

          echo "::error::O baseline cresceu de $base para $total itens sem nenhuma mudança em scripts/lint/rules/. Dívida técnica só pode diminuir — corrija a violação em vez de registrá-la."
          exit 1
