name: Lojas

# Uma loja por branch — ADR 0018, issue #168.
#
# A `main` é o tema. Cada loja é uma branch `loja/<nome>`, conectada à sua loja
# pela integração GitHub da Shopify, e só recebe da `main`. Este workflow é o
# que faz isso valer sem depender de ninguém lembrar:
#
#   conferir  em toda `loja/*`: ela só mudou conteúdo de loja, e o JSON dela
#             aponta só o que o código dela tem
#   propagar  a cada push na `main`: a `main` entra em cada `loja/*`
#
# A terceira metade, o JSON de cada loja contra o código de um PR, mora no
# job `gate` do `ci.yml`, que é o que um PR para a `main` precisa passar.
#
# ── Por que um arquivo separado do ci.yml ──────────────────────────────────
#
# O `ci.yml` declara na abertura que nenhum job dele escreve no repositório, e
# o `propagar` empurra para as `loja/*`. Mesmo motivo do `preview.yml`: a
# permissão de escrita fica confinada ao único job que precisa dela.
#
# ── Os `if:` daqui são de branch, não de secret ─────────────────────────────
#
# O defeito que este repositório já pagou é o job que só roda quando um
# secret existe: as execuções verdes não provavam nada. Aqui o `if:` separa
# QUAL verificação cabe em qual branch, e nenhuma delas depende de secret.

on:
  push:
    branches: [main, 'loja/**']
  pull_request:
    branches: ['loja/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    name: A loja só mudou conteúdo
    # O push numa `loja/*` é, quase sempre, o commit do `shopify[bot]`: a
    # lojista salvou no editor. É exatamente o que precisa ser conferido.
    if: startsWith(github.ref, 'refs/heads/loja/') || startsWith(github.base_ref, 'loja/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # A conferência parte do merge-base com a `main`, e ele não existe
          # num clone raso.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Sem `npm ci`: o script só usa módulos nativos do Node.
      - name: Conferir a loja
        run: node scripts/lojas.mjs conferir

  propagar:
    name: A main entra em cada loja
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Duas propagações ao mesmo tempo disputariam o push das mesmas branches.
    # A segunda espera; cancelar perderia o registro de que a primeira rodou.
    concurrency:
      group: lojas-propagar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # O push feito aqui usa o GITHUB_TOKEN, e push com esse token não
      # dispara workflow. Por isso a conferência NÃO roda de novo sobre o
      # merge: o próprio `propagar` confere o resultado antes de empurrar, e
      # não empurra a loja que reprova.
      #
      # `antes` e `depois` vão por env, não interpolados no shell: é o
      # intervalo em que a checagem procura commit do `shopify[bot]`.
      - name: Propagar
        env:
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: node scripts/lojas.mjs propagar --antes "$ANTES" --depois "$DEPOIS"
