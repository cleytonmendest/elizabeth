name: Board

# O board é uma VISTA do backlog, não a fonte da verdade — essa continua sendo
# a issue. Por isso o fluxo é de mão única: issue → board, nunca o contrário.
#
# ── Um job só, de propósito ────────────────────────────────────────────────
#
# Isto já foram três jobs: `add` (só em evento `issues`), `backfill` (só em
# `workflow_dispatch`) e `sync`. A divisão por tipo de evento produziu o pior
# tipo de bug: o `add` apontava para `actions/add-to-project@v1`, uma tag que
# nunca existiu — a action publica v1.0.0/v1.0.1/v1.0.2 e um `v2` móvel, mas
# nunca um `v1` móvel. Ele foi escrito, revisado e mergeado quebrado, e passou
# dois dias sem ninguém ver, porque as execuções verdes eram todas de
# `workflow_dispatch` e `pull_request` — que PULAM esse job. A primeira issue
# aberta depois disso reprovou, e as seguintes também.
#
# A lição é a mesma que este repositório já aprendeu na catraca do baseline:
# caminho que só roda numa circunstância é caminho que ninguém testa. Agora
# todo gatilho executa exatamente o mesmo código, e uma execução verde de
# qualquer um deles prova o caminho inteiro.
#
# `scripts/board-sync.mjs` reconcilia as duas coisas em cada execução: toda
# issue aberta tem item, e todo item gerido tem o Status que os fatos exigem.
# Recálculo completo é idempotente — rodar de novo conserta divergência.
#
# ── Por que isto precisa de um PAT ─────────────────────────────────────────
#
# O `GITHUB_TOKEN` que o Actions injeta é escopado ao REPOSITÓRIO. O projeto 2
# é de USUÁRIO (github.com/users/cleytonmendest/projects/2), fora do alcance
# dele. E Projects v2 só existe em GraphQL, onde escrever exige escopo
# `project`. Não há como contornar isso com o token padrão.
#
# ── Configurar uma vez ─────────────────────────────────────────────────────
#
#   1. github.com/settings/tokens → "Generate new token (classic)"
#      escopo: `project`, e SÓ ele. (`read:project` marca junto, é
#      sub-escopo.) Listar issues de um repo PÚBLICO não exige escopo nenhum
#      — por isso `repo` não entra aqui: ele daria leitura e escrita em todos
#      os repositórios da conta sem necessidade. Se este repo virar privado um
#      dia, aí sim passa a precisar de `repo` e falha até ganhá-lo.
#      Um token fine-grained também serve, e é mais apertado: limitado a
#      este repositório, com Projects = Read and write.
#   2. No repo: Settings → Secrets and variables → Actions → New repository
#      secret, com o nome PROJECT_TOKEN.
#
# Sem o secret o job REPROVA com a mensagem acima em vez de passar sem fazer
# nada. Um workflow que "passa" sem executar é pior que um que falha: ele some
# do radar.

on:
  issues:
    types: [opened, reopened, transferred, closed]
  # O Status sai destes fatos: PR que fecha a issue, e branch que a reivindica.
  pull_request:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft]
  create:
  delete:
  workflow_dispatch:

# Quem escreve no board é o PROJECT_TOKEN, não o GITHUB_TOKEN — então o token
# injetado pelo Actions só precisa clonar o repositório.
permissions:
  contents: read

# A URL vive num lugar só. Trocar de board é editar esta linha.
env:
  PROJECT_URL: https://github.com/users/cleytonmendest/projects/2

jobs:
  sync:
    name: Board reconciliado com os fatos
    runs-on: ubuntu-latest
    concurrency:
      group: board-sync
      # Um recálculo mais novo torna o anterior irrelevante, então cancelar o
      # velho é seguro (e evita fila em rajada de eventos). Se um cancelado
      # deixaria uma issue de fora, o próximo evento a traz — o recálculo é
      # completo, não incremental.
      cancel-in-progress: true
    steps:
      - name: O secret PROJECT_TOKEN existe?
        env:
          TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta o secret PROJECT_TOKEN. O GITHUB_TOKEN padrão não escreve em projeto de usuário — veja as instruções no topo de .github/workflows/board.yml."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # A lógica pura é exercitável sem rede. Roda ANTES de tocar o board: se
      # ela quebrou, o job para aqui em vez de escrever status errado em 21
      # itens (ou adicionar as issues erradas).
      - name: A tabela de decisão continua valendo?
        run: node scripts/board-sync.mjs --self-test

      - name: Reconciliar o board
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/board-sync.mjs
