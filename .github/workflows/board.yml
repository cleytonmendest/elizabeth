name: Board

# Issue nova entra no board sozinha.
#
# O board é uma VISTA do backlog, não a fonte da verdade — essa continua sendo
# a issue. Por isso o fluxo é de mão única: issue → board, nunca o contrário.
#
# ── Por que isto precisa de um PAT ─────────────────────────────────────────
#
# O `GITHUB_TOKEN` que o Actions injeta é escopado ao REPOSITÓRIO. O projeto 2
# é de USUÁRIO (github.com/users/cleytonmendest/projects/2), fora do alcance
# dele. E Projects v2 só existe em GraphQL, onde escrever exige escopo
# `project`. Não há como contornar isso com o token padrão.
#
# ── Configurar uma vez ─────────────────────────────────────────────────────
#
#   1. github.com/settings/tokens → "Generate new token (classic)"
#      escopo: `project`, e SÓ ele. (`read:project` marca junto, é
#      sub-escopo.) O backfill lista issues de um repo PÚBLICO, o que não
#      exige escopo nenhum — por isso `repo` não entra aqui: ele daria
#      leitura e escrita em todos os repositórios da conta sem necessidade.
#      Se este repo virar privado um dia, aí sim o backfill passa a precisar
#      de `repo` e falha até ganhá-lo.
#      Um token fine-grained também serve, e é mais apertado: limitado a
#      este repositório, com Projects = Read and write.
#   2. No repo: Settings → Secrets and variables → Actions → New repository
#      secret, com o nome PROJECT_TOKEN.
#
# Sem o secret, os dois jobs REPROVAM com a mensagem acima em vez de passar
# sem fazer nada. Um workflow que "passa" sem executar é pior que um que
# falha: ele some do radar.

on:
  issues:
    types: [opened, reopened, transferred]
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Enviar TODAS as issues abertas ao board (idempotente)'
        type: boolean
        default: true

# A URL vive num lugar só. Trocar de board é editar esta linha.
env:
  PROJECT_URL: https://github.com/users/cleytonmendest/projects/2

# Duas execuções ao mesmo tempo tentariam adicionar o mesmo item.
concurrency:
  group: board-${{ github.event.issue.number || 'backfill' }}
  cancel-in-progress: false

jobs:
  add:
    name: Issue nova no board
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: O secret PROJECT_TOKEN existe?
        env:
          TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta o secret PROJECT_TOKEN. O GITHUB_TOKEN padrão não escreve em projeto de usuário — veja as instruções no topo de .github/workflows/board.yml."
            exit 1
          fi

      # Tag maior, como o ci.yml faz com actions/checkout@v5.
      - uses: actions/add-to-project@v1
        with:
          project-url: ${{ env.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_TOKEN }}

  backfill:
    name: Backfill das issues abertas
    if: github.event_name == 'workflow_dispatch' && inputs.backfill
    runs-on: ubuntu-latest
    steps:
      - name: O secret PROJECT_TOKEN existe?
        env:
          TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta o secret PROJECT_TOKEN. O GITHUB_TOKEN padrão não escreve em projeto de usuário — veja as instruções no topo de .github/workflows/board.yml."
            exit 1
          fi

      - name: Enviar as issues abertas
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail

          # Deriva dono e número da mesma URL que o outro job usa, para os dois
          # nunca apontarem para boards diferentes.
          owner=$(printf '%s' "$PROJECT_URL" | sed -E 's#.*/(users|orgs)/([^/]+)/projects/[0-9]+.*#\2#')
          number=$(printf '%s' "$PROJECT_URL" | sed -E 's#.*/projects/([0-9]+).*#\1#')
          if [ -z "$owner" ] || [ -z "$number" ]; then
            echo "::error::Não consegui extrair dono e número de PROJECT_URL ($PROJECT_URL)."
            exit 1
          fi
          echo "Board: projeto $number de $owner"

          gh issue list --repo "$REPO" --state open --limit 500 --json url --jq '.[].url' > urls.txt
          total=$(wc -l < urls.txt | tr -d ' ')
          echo "$total issue(s) aberta(s) em $REPO"

          # `item-add` casa pelo conteúdo: reenviar uma issue que já está no
          # board devolve o item existente em vez de duplicar. Por isso rodar
          # de novo é seguro — e é como se corrige uma divergência.
          falhas=0
          while read -r url; do
            [ -n "$url" ] || continue
            if gh project item-add "$number" --owner "$owner" --url "$url" </dev/null >/dev/null; then
              echo "  ok   $url"
            else
              echo "  FALHOU  $url"
              falhas=$((falhas + 1))
            fi
          done < urls.txt

          # Uma issue que falha não pode abortar as outras 20 — mas o job
          # também não pode terminar verde escondendo a falha.
          if [ "$falhas" -gt 0 ]; then
            echo "::error::$falhas de $total issue(s) não entraram no board."
            exit 1
          fi
          echo "$total issue(s) no board."
